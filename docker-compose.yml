services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pocketmoney
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, voir .env.production.example}
      POSTGRES_DB: pocketmoney
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketmoney"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VITE_LEGAL_OPERATOR: ${LEGAL_OPERATOR:?LEGAL_OPERATOR manquant, voir .env.production.example}
        VITE_LEGAL_CONTACT: ${LEGAL_CONTACT:?LEGAL_CONTACT manquant, voir .env.production.example}
        VITE_LEGAL_HOST: ${LEGAL_HOST:?LEGAL_HOST manquant, voir .env.production.example}
        VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Passe par nginx puis l'API puis la base : toute la chaîne est vérifiée.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Seul Caddy est exposé : il termine le HTTPS devant nginx.
    expose:
      - "80"
    environment:
      # schema.prisma declares provider = "postgresql" — this must stay a
      # postgresql:// URL, not a SQLite file: path (see QA_BUG_REPORT.md, ENV-1).
      DATABASE_URL: postgresql://pocketmoney:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@db:5432/pocketmoney
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, voir .env.production.example}
      JWT_EXPIRES_IN: 7d
      SENTRY_DSN: ${SENTRY_DSN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY manquant, voir .env.production.example}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM manquant, voir .env.production.example}
      PORT: 3001
      CLIENT_URL: https://${DOMAIN:?DOMAIN manquant, voir .env.production.example}
      # Caddy puis nginx : deux proxys devant l'API. Caddy ignore le X-Forwarded-For
      # reçu d'Internet, un client ne peut donc pas usurper son IP.
      TRUST_PROXY_HOPS: 2

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: pocketmoney
      PGDATABASE: pocketmoney
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./deploy:/deploy:ro
      - db-backups:/backups
    command: ["sh", "/deploy/backup.sh"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant, voir .env.production.example}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  db-backups:
  caddy-data:
  caddy-config:
