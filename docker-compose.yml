services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pocketmoney
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, voir .env.production.example}
      POSTGRES_DB: pocketmoney
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketmoney"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      # schema.prisma declares provider = "postgresql" — this must stay a
      # postgresql:// URL, not a SQLite file: path (see QA_BUG_REPORT.md, ENV-1).
      DATABASE_URL: postgresql://pocketmoney:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@db:5432/pocketmoney
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, voir .env.production.example}
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL manquant, voir .env.production.example}
      # nginx, dans ce conteneur, est le seul proxy devant l'API.
      TRUST_PROXY_HOPS: 1

volumes:
  db-data:
